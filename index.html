<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Studio — Exam Study Hub</title><style>
:root{--bg:#0b1020;--sidebar:#0e1528;--card:#151d31;--card2:#1c2740;--line:#2d3850;--ink:#eff3ff;--muted:#a6b2c7;--accent:#97b5ff;--ok:#77dfb5;--bad:#f3a4a4;--gold:#f8d99c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}#app{display:flex;min-height:100vh}aside{position:sticky;top:0;align-self:flex-start;width:316px;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--sidebar);padding:22px 16px;flex-shrink:0}main{flex:1;min-width:0;max-width:1250px;margin:0 auto;padding:38px 54px 100px}a{color:var(--accent)}.brand{font-weight:800;font-size:22px;letter-spacing:-.7px;margin:0 0 4px}.brand span{color:var(--accent)}.small,.meta{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.side-search,input[type=text],input[type=search]{width:100%;background:#101a30;border:1px solid #34425b;border-radius:11px;padding:11px 12px;color:var(--ink);outline:none}.side-search:focus,input:focus{border-color:var(--accent)}.group-head{font-size:11px;color:#8396b6;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:18px 10px 7px}.nav{display:flex;gap:9px;width:100%;border:0;background:transparent;text-align:left;color:#c4d0e6;padding:9px 10px;border-radius:10px;line-height:1.35;font-size:12.5px;align-items:center}.nav:hover{background:#22304c}.nav.active{background:#28395f;color:white}.num{font-size:10px;color:#8c9dbd;width:20px;flex-shrink:0}.dot{margin-left:auto;font-size:12px;color:var(--ok)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px}.h1{font-size:clamp(29px,3.4vw,43px);line-height:1.16;letter-spacing:-1.35px;margin:9px 0 14px}.lead{color:#bdc9de;max-width:840px;font-size:15px}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:24px;margin:20px 0}.sectionhead{font-size:12px;color:var(--accent);text-transform:uppercase;font-weight:800;letter-spacing:1.5px;margin-bottom:12px}.formula{background:#10192c;border:1px solid #344361;border-left:3px solid var(--accent);border-radius:9px;padding:15px 17px;white-space:pre-wrap;line-height:1.95;font-size:15px;overflow-wrap:anywhere}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:19px}.steps{counter-reset:step;list-style:none;padding:0;margin:0}.steps li{counter-increment:step;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #2b354a}.steps li:last-child{border-bottom:0}.steps li:before{content:counter(step);height:23px;width:23px;min-width:23px;border-radius:50%;background:#2d3c61;color:#dce6ff;text-align:center;line-height:23px;font-size:12px;font-weight:800}.tag{padding:5px 10px;background:#283756;border-radius:999px;color:#bed1f6;font-size:12px;white-space:nowrap}.btn{border:1px solid #405376;border-radius:10px;padding:10px 16px;background:#243452;color:#eaf0ff;font-size:13px;font-weight:700}.btn:hover{background:#344d7c}.btn.primary{background:#8caaff;color:#071228;border-color:#8caaff}.btn.primary:hover{background:#aec4ff}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.question{background:var(--card);padding:22px;border:1px solid var(--line);border-radius:16px;margin:14px 0}.qhead{display:flex;gap:8px;justify-content:space-between;color:var(--muted);font-size:12px;align-items:center}.qtext{font-weight:650;font-size:16px;margin:13px 0}.answerrow{display:flex;gap:9px;flex-wrap:wrap}.answerrow input{max-width:400px;flex:1;min-width:180px}.feedback{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:13px}.feedback.good{background:#17372f;color:#a2f3ce}.feedback.bad{background:#3a2734;color:#ffbcbf}.solution{background:#10192b;border:1px solid #37415b;border-radius:9px;padding:13px 15px;margin-top:13px;font-size:13px;color:#d6e3fa;white-space:pre-wrap}.progress{height:8px;background:#2c3652;overflow:hidden;border-radius:99px}.progress>div{height:100%;background:linear-gradient(90deg,#80a1ff,#79dbbf);transition:width .25s}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px}.big{font-size:29px;font-weight:850;letter-spacing:-1px}.divider{border-top:1px solid var(--line);margin:26px 0}.topicgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topiccard{padding:17px;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:13px;transition:transform .1s}.topiccard:hover{transform:translateY(-2px);border-color:#718cc1}.pill{display:inline-block;border:1px solid #435272;color:#b9c6e3;font-size:11px;border-radius:99px;padding:3px 9px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.quizChoice{display:block;width:100%;padding:15px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);margin:10px 0}.quizChoice:hover{border-color:#7e9de7}.hide{display:none}.mobilebutton{display:none}.notice{font-size:12px;color:var(--muted);padding:13px;background:#121b2f;border-radius:11px;border:1px solid var(--line)}#navclose{display:none}footer{font-size:12px;color:#7f90ad;padding-top:40px}.groupbox{padding:13px 0;border-bottom:1px solid var(--line)}.inlineStat{font-weight:700;color:var(--ok)}
@media(max-width:980px){aside{position:fixed;z-index:50;left:-340px;transition:left .2s;box-shadow:15px 0 55px #0006}aside.open{left:0}main{padding:24px 20px 80px;width:100%}.mobilebutton,#navclose{display:inline-block}.grid2,.topicgrid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){.tiles{grid-template-columns:1fr 1fr}.panel,.question{padding:17px}.h1{font-size:31px}}
sup,sub{font-size:.73em;line-height:0;position:relative;vertical-align:baseline}sup{top:-.52em}sub{bottom:-.22em}.formula sup,.formula sub{font-weight:600}</style></head><body><div id="app"><aside id="side"><div class="top"><div><div class="brand">∑ <span>Math Studio</span></div><div class="small">Complete lecture study hub</div></div><button id="navclose" class="btn ghost" onclick="toggleSide(false)">✕</button></div><input id="search" type="search" class="side-search" placeholder="Search topics, formulas..." oninput="renderSidebar()"><div style="margin:15px 4px"><div class="small" id="sideStats"></div><div class="progress" style="margin-top:7px"><div id="sideBar" style="width:0"></div></div></div><div id="links"></div><div class="divider"></div><button class="btn" style="width:100%" onclick="showHome()">⌂ Dashboard</button></aside><main id="content"></main></div>
<script>const DATA=[{"group": "Optimization & Linear Algebra", "title": "Constrained vs. unconstrained optimization", "source": "Oct 2 pp. 1–2", "concept": "Unconstrained extrema allow every point in the domain. Constrained extrema must satisfy one or more equations; the feasible set may be a curve, plane, surface, or intersection. For compact feasible sets, continuous functions attain global maximum and minimum. An interior stationary point need not be a global extremum.", "formulas": "Unconstrained: ∇f=0. Constraint: g(x)=0. Substitution: solve for a variable, then differentiate the reduced function.", "method": "Identify the feasible set → eliminate one variable when practical → differentiate → solve critical equations → check boundaries / competing candidates → evaluate objective.", "example": "Minimize x²+y² subject to x+y=6.", "steps": ["Put y=6−x.", "F(x)=x²+(6−x)²=2x²−12x+36.", "F′(x)=4x−12=0, so x=3 and y=3.", "F″=4>0, hence minimum is 18; there is no maximum along the full line."], "qs": [{"q": "Minimum value of x²+y² with x+y=10", "a": "50", "why": "Set y=10−x and minimize at x=y=5; 25+25=50."}, {"q": "Where does the minimum x²+y² subject to x+y=8 occur? Give (x,y).", "a": "4,4", "why": "By symmetry or derivatives x=y=4."}, {"q": "Does x²+y² have a maximum on x+y=8 over all real x,y?", "a": "no", "why": "The constraint line is unbounded and the objective tends to infinity."}]}, {"group": "Optimization & Linear Algebra", "title": "Lagrange multipliers: one constraint", "source": "Oct 2 pp. 2–4; Oct 6 p. 1", "concept": "At a smooth constrained optimum, the objective gradient is parallel to the constraint gradient. The multiplier encodes the proportionality, subject to regularity ∇g≠0. Lagrange stationary points are candidates, not guaranteed maxima or minima.", "formulas": "L(x,λ)=f(x)+λg(x); ∇ₓL=0 and g(x)=0. Equivalently ∇f=−λ∇g.", "method": "Write g=0 → build L → take partial derivatives including λ → solve all cases → compare objective values and investigate singular points.", "example": "Minimize x²+y²+z² with x+2y+3z=4.", "steps": ["Set L=x²+y²+z²+λ(x+2y+3z−4).", "2x+λ=0, 2y+2λ=0, 2z+3λ=0.", "Thus (x,y,z)=−λ(1,2,3)/2. Substitute: −7λ=4, λ=−4/7.", "Point (2/7,4/7,6/7); minimum value 8/7."], "qs": [{"q": "Minimum x²+y² with x+y=6", "a": "18", "why": "Lagrange equations give x=y=3."}, {"q": "Minimize x²+y²+z² with x+2y+2z=9: what is minimum?", "a": "9", "why": "Normal vector squared length 9, so min is 9²/9=9."}, {"q": "What extra equation arises from ∂L/∂λ=0 for g=0?", "a": "g=0", "why": "Differentiating L=f+λg with respect to λ returns the constraint."}]}, {"group": "Optimization & Linear Algebra", "title": "Lagrange multipliers: two constraints", "source": "Oct 6 pp. 2–4", "concept": "For two equality constraints in three variables, constrained extrema are sought on the intersection. Both multipliers must be included. Linear constraints plus a strictly convex squared-distance objective yield a unique closest point when feasible.", "formulas": "L=f+λg+μh; ∇f+λ∇g+μ∇h=0, g=0, h=0.", "method": "Write both constraints → derive three gradient equations → solve multipliers / coordinates → verify both constraints → classify with geometry or compare.", "example": "Minimize x²+y²+z² given x+y+z=6 and x−y=0.", "steps": ["Set x=y=t; then z=6−2t.", "F(t)=2t²+(6−2t)²=6t²−24t+36.", "F′=12t−24=0, so t=2 and z=2.", "Nearest point is (2,2,2), squared distance 12."], "qs": [{"q": "Minimize x²+y²+z² when x+y+z=3 and x=y. Minimum?", "a": "3", "why": "x=y=z=1, sum of squares 3."}, {"q": "How many multiplier variables for three independent equality constraints?", "a": "3", "why": "Introduce λ₁, λ₂, λ₃."}, {"q": "Minimize x²+y² given x+y=4 and x−y=0. Minimum?", "a": "8", "why": "Both constraints force (2,2)."}]}, {"group": "Optimization & Linear Algebra", "title": "Boundary cases, nonnegative variables & absolute extrema", "source": "Oct 6 pp. 1, 4–6; Oct 7 pp. 1–2", "concept": "Nonnegativity, zero coordinates, and branches where Lagrange equations factor must be checked. A continuous objective on a closed, bounded feasible set reaches absolute extrema, but stationary-point equations alone may miss irregular points.", "formulas": "Stationary set + boundary candidates + singular candidates → compare f-values.", "method": "Enumerate algebraic branches (e.g., x=0 or λ=−1) and boundary intersections. Evaluate f on each candidate instead of declaring the first stationary point optimal.", "example": "On x²+y²=1, maximize xy.", "steps": ["Use xy=( (x+y)²−1 )/2 or ∇ constraints.", "Stationary solutions include x=y=±1/√2 (xy=1/2), and x=−y=±1/√2 (xy=−1/2).", "Compare: max 1/2, min −1/2."], "qs": [{"q": "Maximum of xy on x²+y²=4", "a": "2", "why": "2|xy|≤x²+y²=4; equality x=y=±√2 gives xy=2."}, {"q": "Minimum x²+y²+z² on the unit sphere?", "a": "1", "why": "The expression equals 1 everywhere."}, {"q": "Must a feasible coordinate equal zero be checked if nonnegative?", "a": "yes", "why": "Zero coordinates are boundary cases that may contain extrema."}]}, {"group": "Optimization & Linear Algebra", "title": "Parametrizing constraint intersections", "source": "Oct 6 p. 6; Oct 7 p. 2", "concept": "A curve formed by intersecting surfaces can often be parametrized and the multivariable objective turned into a single-variable function. Check the parameter interval and endpoints when appropriate.", "formulas": "Circle: x=r cos θ, y=r sin θ. Identity: sin²θ+cos²θ=1.", "method": "Use a constraint to parametrize the curve → substitute into the other constraint and objective → compute derivative → solve trigonometric critical points → evaluate.", "example": "Find extrema of xy+z² on x=y and x²+y²+z²=4.", "steps": ["Take x=y=√2 cos θ, z=2 sin θ.", "Then xy+z²=2cos²θ+4sin²θ=2+2sin²θ.", "Minimum 2 at z=0, x=y=±√2; maximum 4 at x=y=0, z=±2."], "qs": [{"q": "Maximum of x² on x²+y²=9", "a": "9", "why": "Take x=3cosθ and maximize 9cos²θ."}, {"q": "Minimum of z² on unit sphere", "a": "0", "why": "Choose any point with z=0."}, {"q": "At x=r cosθ,y=r sinθ, simplify x²+y²", "a": "r²", "why": "Apply the Pythagorean identity."}]}, {"group": "Optimization & Linear Algebra", "title": "Closest points, distance to a plane", "source": "Oct 6 pp. 2–4; Oct 7 p. 3", "concept": "Closest-point questions minimize squared Euclidean distance (same minimizer as distance). For an affine plane, projecting along its normal yields a direct closed form. Also relevant: minimum-norm solutions of underdetermined linear systems.", "formulas": "Plane ax+by+cz=d: distance from p₀=(x₀,y₀,z₀) is |ax₀+by₀+cz₀−d|/√(a²+b²+c²). Closest point p*=p₀−[(n·p₀−d)/||n||²]n.", "method": "Extract plane normal → compute signed deviation → project onto normal → check plane equation. For multiple linear constraints use Lagrange or linear algebra.", "example": "Find the point on x+2y+2z=9 closest to origin.", "steps": ["n=(1,2,2), ||n||²=9.", "p*=9n/9=(1,2,2).", "Distance √(1+4+4)=3."], "qs": [{"q": "Distance from (0,0,0) to plane x+2y+2z=9", "a": "3", "why": "Apply |−9|/√9=3."}, {"q": "Distance from (1,0,0) to plane x=4", "a": "3", "why": "Absolute horizontal difference |1−4|."}, {"q": "Point on x+y=4 nearest (0,0)", "a": "2,2", "why": "Orthogonal projection on normal (1,1)."}]}, {"group": "Optimization & Linear Algebra", "title": "Linear systems, determinants & Cramer’s rule", "source": "Oct 6 pp. 2–3; Oct 7 p. 4", "concept": "Cramer’s rule solves square systems Ax=b when det A≠0; replacing column i by b gives Aᵢ. A zero determinant means Cramer’s quotient is not valid and unique solvability fails. Row reduction is an alternative.", "formulas": "xᵢ=det(Aᵢ)/det(A). For 2×2, det [[a,b],[c,d]]=ad−bc.", "method": "Write coefficient matrix → find determinant → replace each column with RHS → calculate determinants → divide → verify in original equations.", "example": "Solve 2x+y=5, x−y=1.", "steps": ["A=[[2,1],[1,−1]], det(A)=−3.", "Aₓ=[[5,1],[1,−1]], det=−6, so x=2.", "Aᵧ=[[2,5],[1,1]], det=−3, so y=1."], "qs": [{"q": "Solve 2x+y=7 and x−y=2. Give x", "a": "3", "why": "Add equations: 3x=9."}, {"q": "Determinant of [[3,2],[4,1]]", "a": "-5", "why": "3·1−2·4=−5."}, {"q": "If det(A)=0, can Cramer’s rule find a unique solution?", "a": "no", "why": "Nonzero determinant is required."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Least squares: objective & residuals", "source": "Oct 7 pp. 5–6; Oct 14 pp. 1–2", "concept": "Given (xᵢ,yᵢ), fit ŷ=α+βx by minimizing squared vertical residuals, not horizontal distances. A residual is observed minus predicted value. A fit need not describe nonlinear structure or unusual outliers well.", "formulas": "rᵢ=yᵢ−(α+βxᵢ); SSE E(α,β)=Σ[yᵢ−α−βxᵢ]².", "method": "Choose intercept and slope → compute predictions → residuals → square and sum → vary α and β to minimize SSE.", "example": "For (0,1),(1,3),(2,5), fit y=1+2x.", "steps": ["Predictions are 1,3,5.", "Residuals all zero, so SSE=0.", "No smaller SSE is possible; line is exact."], "qs": [{"q": "For y=2+3x, residual at (2,10)", "a": "2", "why": "Prediction 8, residual 10−8=2."}, {"q": "SSE for residuals 1,−2,3", "a": "14", "why": "Square and add 1+4+9."}, {"q": "Does least-squares line minimize horizontal distances?", "a": "no", "why": "Ordinary regression minimizes squared vertical residuals."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Normal equations for linear regression", "source": "Oct 7 pp. 6–8; Oct 14 pp. 2–4", "concept": "Set ∂E/∂α=0 and ∂E/∂β=0. The resulting 2×2 system is the normal equations. Uniqueness requires not all xᵢ to be equal.", "formulas": "nα+(Σxᵢ)β=Σyᵢ; (Σxᵢ)α+(Σxᵢ²)β=Σxᵢyᵢ; det=nΣx²−(Σx)².", "method": "Calculate n, Σx, Σy, Σx², Σxy → form 2×2 system → solve by elimination or Cramer’s rule → write ŷ=α+βx.", "example": "Fit (0,1),(1,3),(2,5).", "steps": ["n=3, Σx=3, Σy=9, Σx²=5, Σxy=13.", "3α+3β=9 and 3α+5β=13.", "Subtract to get 2β=4 ⇒ β=2; α=1."], "qs": [{"q": "If all x-values equal, is slope uniquely identifiable?", "a": "no", "why": "Then nΣx²−(Σx)²=0."}, {"q": "For points (0,2),(1,4), what is slope?", "a": "2", "why": "Rise 2 over run 1."}, {"q": "Which sums appear in the normal equations?", "a": "n, sum x, sum y, sum x², sum xy", "why": "Those are the five sufficient sample totals."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Centered sums Sxx, Syy, Sxy", "source": "Oct 14 pp. 5–8; Oct 16 p. 1", "concept": "Centered sums summarize the scatter around sample means. They relate to sample variance, sample covariance, and regression slope. Beware distinction between sums and quantities divided by n−1.", "formulas": "x̄=Σx/n, ȳ=Σy/n; Sxx=Σ(x−x̄)²=Σx²−(Σx)²/n; Sxy=Σ(x−x̄)(y−ȳ)=Σxy−ΣxΣy/n.", "method": "Compute means → centered deviations → products/squares → sum → optionally verify shortcut identities.", "example": "For (x,y)=(1,2),(2,4),(3,6), compute Sxy.", "steps": ["Means x̄=2,ȳ=4.", "Products of deviations: (−1)(−2)=2,0,(1)(2)=2.", "Sxy=4."], "qs": [{"q": "Sxx for x=1,2,3", "a": "2", "why": "Mean 2; squared deviations 1+0+1=2."}, {"q": "Syy for y=2,4,6", "a": "8", "why": "Mean 4; squares 4+0+4=8."}, {"q": "Sample covariance if Sxy=12,n=4", "a": "4", "why": "Use Sxy/(n−1)=12/3."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Regression coefficients, centroid & uniqueness", "source": "Oct 14 pp. 4–7", "concept": "The fitted line passes through (x̄,ȳ). Slope is Sxy/Sxx when Sxx>0; intercept makes the line pass through the means. Strictly positive Hessian determinant gives a unique minimizer when x-values vary.", "formulas": "β=Sxy/Sxx=[nΣxy−ΣxΣy]/[nΣx²−(Σx)²]; α=ȳ−βx̄. Hessian determinant =4[nΣx²−(Σx)²]>0 for varying x.", "method": "Compute sample means → Sxx/Sxy → slope → intercept → check it passes through centroid.", "example": "For (1,1),(2,3),(3,5), find line.", "steps": ["x̄=2,ȳ=3; Sxx=2; Sxy=4.", "β=2, α=3−2·2=−1.", "Line ŷ=−1+2x."], "qs": [{"q": "If x̄=4,ȳ=10,β=2, what is α?", "a": "2", "why": "α=10−2·4=2."}, {"q": "If Sxy=6 and Sxx=3, slope?", "a": "2", "why": "β=6/3."}, {"q": "Do least-squares fitted lines with intercept pass through (x̄,ȳ)?", "a": "yes", "why": "The first normal equation implies α+βx̄=ȳ."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Schwarz inequality & regression existence", "source": "Oct 7 p. 7; Oct 14 pp. 7–8", "concept": "The Cauchy–Schwarz (Schwarz) inequality controls dot products and proves nonnegative centered-sum determinants. Equality means the two vectors are proportional. Regression slope is undefined when all predictors are identical.", "formulas": "|Σaᵢbᵢ|≤√(Σaᵢ² Σbᵢ²); (Σx)²≤nΣx²; |Sxy|≤√(Sxx Syy).", "method": "Recognize dot-product form → square both sides when needed → check equality using proportionality.", "example": "Apply to x=(1,2), y=(3,4).", "steps": ["Dot product =11.", "Squared norms are 5 and 25.", "|11|≤√125≈11.18, consistent."], "qs": [{"q": "Upper bound on |Sxy| if Sxx=9,Syy=16", "a": "12", "why": "√(9·16)=12."}, {"q": "When is (Σx)²=nΣx² an equality?", "a": "all x equal", "why": "Vector x proportional to all-ones vector."}, {"q": "If Sxx=0, is slope Sxy/Sxx defined?", "a": "no", "why": "Division by zero; no variability in x."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Sample variance, covariance & Pearson correlation", "source": "Oct 14 p. 8; Oct 16 pp. 1–3", "concept": "Sample variance = centered sum/(n−1), sample covariance = Sxy/(n−1). Pearson sample correlation is dimensionless, in [−1,1], with sign showing direction of linear association. The coefficient is not a causal measure.", "formulas": "sₓ²=Sxx/(n−1); sᵧ²=Syy/(n−1); sₓᵧ=Sxy/(n−1); r=Sxy/√(Sxx Syy).", "method": "Compute centered sums → divide for sample variance/covariance if asked → calculate r directly using sums → interpret sign and closeness to ±1.", "example": "x=(1,2,3), y=(2,4,6).", "steps": ["Sxx=2,Syy=8,Sxy=4.", "r=4/√16=1.", "Perfect positive linear relation; sₓ²=1, sᵧ²=4, sample covariance=2."], "qs": [{"q": "If Sxy=−6,Sxx=9,Syy=4, r?", "a": "-1", "why": "−6/√36=−1."}, {"q": "If n=5 and Sxx=12, sample variance?", "a": "3", "why": "Use 12/(5−1)=3."}, {"q": "Does r=0 always imply independence?", "a": "no", "why": "Zero linear correlation does not eliminate nonlinear dependence."}]}, {"group": "Least Squares & Correlation (Data)", "title": "Anscombe’s quartet & limits of summaries", "source": "Oct 16 pp. 3–5", "concept": "Datasets can share the same mean, variance, regression line, and correlation, yet have radically different scatterplots. Curvature, outliers, high-leverage points, and vertical clusters make visualization essential.", "formulas": "Same x̄,ȳ,Sxx,Sxy,r,regression line ≠ same data pattern.", "method": "Inspect scatterplot → test shape, outliers, influential x-values, unusual clustering → interpret statistics with plots.", "example": "Anscombe’s quartet illustrates four sets with nearly identical summary statistics.", "steps": ["One set is roughly linear.", "Another forms a curved relationship.", "Another has an outlier influencing regression.", "Another has most x-values identical plus one high-leverage point."], "qs": [{"q": "Can equal correlations imply equal-looking scatterplots?", "a": "no", "why": "Anscombe’s quartet disproves this."}, {"q": "What is a high-leverage point often extreme in?", "a": "x", "why": "Leverage refers to unusual predictor values."}, {"q": "Should you inspect residuals and scatterplots alongside regression?", "a": "yes", "why": "Summaries alone can conceal important patterns."}]}, {"group": "Probability Foundations", "title": "Random experiments, statistical regularity", "source": "Oct 20 pp. 1–2", "concept": "A random experiment has uncertain outcome before performance; repeating it under comparable conditions produces frequency patterns. Relative frequency motivates probability but is not a guaranteed deterministic finite-sample fraction.", "formulas": "Relative frequency fₙ/n → p as n grows (law of large numbers in standard settings).", "method": "Identify the trial and possible outcomes → distinguish individual unpredictability from long-run regularity → compute relative frequencies.", "example": "A coin gives 53 heads in 100 tosses.", "steps": ["Observed relative frequency=53/100=0.53.", "This is an estimate of the probability of heads, not proof that p=0.53."], "qs": [{"q": "Relative frequency of 18 successes in 60", "a": "0.3", "why": "18/60=0.30."}, {"q": "Is each outcome of an ordinary random coin toss predictable with certainty?", "a": "no", "why": "The experiment is random."}, {"q": "For fair coin, limiting head frequency tends to what?", "a": "0.5", "why": "Long-run frequency approaches 1/2."}]}, {"group": "Probability Foundations", "title": "Sample spaces, outcomes & events", "source": "Oct 20 pp. 2–4; Oct 21 pp. 1–3", "concept": "Sample space Ω (or S) is all possible outcomes. An event is a subset E⊆Ω. Distinguish simple outcomes from compound events; events impossible ∅ or certain Ω. Product experiments create ordered tuples.", "formulas": "0≤P(E)≤1, P(Ω)=1, P(∅)=0. For independent uniform rolls, |Ω|=6ⁿ.", "method": "Write a complete, mutually exclusive sample space → describe event as subset → determine event probability.", "example": "Roll one die; event E=even.", "steps": ["Ω={1,2,3,4,5,6}; E={2,4,6}.", "Under fair die P(E)=3/6=1/2."], "qs": [{"q": "Number of outcomes for a coin and a six-sided die", "a": "12", "why": "2×6=12."}, {"q": "Number outcomes for two ordered dice", "a": "36", "why": "6×6=36."}, {"q": "P(impossible event)", "a": "0", "why": "A probability axiom."}]}, {"group": "Probability Foundations", "title": "Equally likely counting & fair dice", "source": "Oct 20 p. 4; Oct 21 pp. 2–5", "concept": "For a finite equally likely sample space, probability is favorable outcomes divided by all outcomes. For ordered dice distinguish (i,j) from (j,i); sum probabilities have a triangular distribution.", "formulas": "P(E)=|E|/|Ω|; P(sum=7 with two dice)=6/36=1/6.", "method": "List/count all equally likely outcomes → count favorable outcomes without double counting → simplify fraction.", "example": "Two dice: probability sum equals 8.", "steps": ["Ordered pairs: (2,6),(3,5),(4,4),(5,3),(6,2).", "5 favorable out of 36 → P=5/36."], "qs": [{"q": "P(sum 7 on two fair dice)", "a": "1/6", "why": "Six ordered pairs out of 36."}, {"q": "P(even on one fair die)", "a": "1/2", "why": "Three even faces of six."}, {"q": "P(first die=6 and second die=6)", "a": "1/36", "why": "One ordered outcome out of 36."}]}, {"group": "Probability Foundations", "title": "Unions, intersections, complements & Venn diagrams", "source": "Oct 21 pp. 4–6; Oct 23 p. 1", "concept": "A∪B means either event; A∩B means both; Aᶜ means not A. Disjoint events have empty intersection. Union probability must subtract overlap.", "formulas": "P(A∪B)=P(A)+P(B)−P(A∩B); P(Aᶜ)=1−P(A); if A∩B=∅, P(A∪B)=P(A)+P(B).", "method": "Translate OR/AND/NOT → calculate individual and overlap probabilities → use inclusion–exclusion / complement.", "example": "On die A=even, B={4,5,6}, find P(A∪B).", "steps": ["A={2,4,6}, B={4,5,6}; intersection {4,6}.", "|A∪B|=3+3−2=4; probability 4/6=2/3."], "qs": [{"q": "If P(A)=0.4,P(B)=0.5,P(A∩B)=0.1, union?", "a": "0.8", "why": "0.4+0.5−0.1=0.8."}, {"q": "If P(A)=0.27, complement?", "a": "0.73", "why": "1−0.27=0.73."}, {"q": "If A and B disjoint, intersection probability?", "a": "0", "why": "No outcomes in common."}]}, {"group": "Probability Foundations", "title": "Probability axioms, monotonicity & additivity", "source": "Oct 21 pp. 6–8", "concept": "Probability measure obeys nonnegativity, total mass 1 and finite/countable additivity for disjoint events. Implications: empty event probability zero; monotonicity for A⊆B; complement and disjoint union rules. A distribution table must total one.", "formulas": "A⊆B⇒P(A)≤P(B). Disjoint Aᵢ ⇒ P(∪Aᵢ)=ΣP(Aᵢ). Σω P({ω})=1.", "method": "Check whether events partition Ω → add masses if disjoint → otherwise subtract overlaps → verify totals in [0,1].", "example": "If E⊆F, P(E)=0.2, P(F)=0.7.", "steps": ["Because E⊆F, F=E∪(F\\E) disjoint.", "P(F\\E)=0.7−0.2=0.5."], "qs": [{"q": "Can P(A)=1.2 in valid probability model?", "a": "no", "why": "Probabilities must lie in [0,1]."}, {"q": "If P(E)=0.2 and E⊆F with P(F)=0.7, P(F without E)?", "a": "0.5", "why": "Subtract 0.7−0.2."}, {"q": "Sum probabilities of all atomic outcomes?", "a": "1", "why": "Normalization axiom."}]}, {"group": "Probability Foundations", "title": "Independence of two events", "source": "Oct 23 pp. 2–3", "concept": "Events A and B are independent when observing one does not change the other’s probability (when conditioning is defined). Product rule is the operational test. Disjoint positive-probability events are NOT independent. Sampling with replacement often yields independence, without replacement generally not.", "formulas": "A ⟂ B iff P(A∩B)=P(A)P(B). With P(B)>0: P(A|B)=P(A).", "method": "Compute P(A), P(B), P(A∩B) → multiply marginals → compare exactly.", "example": "An urn contains 4 white and 7 black; draw 2 with replacement.", "steps": ["P(first white)=4/11 and P(second black)=7/11.", "P(white then black)=(4/11)(7/11)=28/121.", "Equal to product; draws independent with replacement."], "qs": [{"q": "Independent P(A)=0.3, P(B)=0.4, P(A∩B)?", "a": "0.12", "why": "Multiply 0.3×0.4."}, {"q": "Are successive draws without replacement generally independent?", "a": "no", "why": "First draw alters second draw probabilities."}, {"q": "Can disjoint A,B with P(A),P(B)>0 be independent?", "a": "no", "why": "Intersection 0 but product >0."}]}, {"group": "Probability Foundations", "title": "Multiple-event independence", "source": "Oct 27 p. 1", "concept": "Mutual independence of n events requires the product rule for every selected subset of size ≥2. Pairwise independence alone does not guarantee mutual independence. For n=3 verify three pairs AND the triple intersection.", "formulas": "P(∩ᵢ∈I Aᵢ)=∏ᵢ∈I P(Aᵢ), every subset I with |I|≥2.", "method": "For n=3 test AB, AC, BC and ABC. For n larger, test all subset sizes if proving independence from scratch.", "example": "Two fair coins: A=first H, B=second H, C=even number of heads.", "steps": ["P(A)=P(B)=P(C)=1/2; each pair overlap=1/4.", "But P(A∩B∩C)=1/4≠(1/2)³=1/8.", "Pairwise independent but not mutually independent."], "qs": [{"q": "How many pairwise tests for 3 events?", "a": "3", "why": "AB,AC,BC."}, {"q": "Does pairwise independence imply mutual independence?", "a": "no", "why": "Triple intersection also matters."}, {"q": "For 3 independent events of probabilities 1/2 each, triple intersection?", "a": "1/8", "why": "Product (1/2)³."}]}, {"group": "Counting & Distributions", "title": "Factorials, permutations & order", "source": "Oct 27 pp. 2–3", "concept": "When selecting distinct objects in order without replacement, use permutations. Arrange all n objects in n! ways. Fundamental counting principle multiplies choices from successive stages.", "formulas": "n!=n(n−1)…1, 0!=1; P(n,k)=n!/(n−k)!; P(n,n)=n!.", "method": "Ask whether order matters → count sequential choices → multiply decreasing factors → check constraints.", "example": "Choose 3 of 6 books to place in 3 ordered slots.", "steps": ["6 choices for first, 5 for second, 4 for third.", "Total 6·5·4=120."], "qs": [{"q": "Permutations of 5 distinct objects", "a": "120", "why": "5!=120."}, {"q": "Ordered selections of 2 from 7", "a": "42", "why": "7×6=42."}, {"q": "What is 0!?", "a": "1", "why": "Definition consistent with combinations and recurrences."}]}, {"group": "Counting & Distributions", "title": "Combinations & unordered selection", "source": "Oct 27 p. 3", "concept": "When order does not matter and objects are distinct, choose subsets using binomial coefficients. Divide permutations by k! because each subset can be ordered k! ways.", "formulas": "C(n,k)=n!/[k!(n−k)!]; P(n,k)=k!C(n,k); C(n,k)=C(n,n−k).", "method": "Check whether order changes the outcome → if not use C(n,k) → simplify factorials first.", "example": "Choose a 3-member committee from 6 people.", "steps": ["C(6,3)=6!/(3!3!)=20.", "Listing all ordered arrangements would give 120 and overcount each committee 6 times."], "qs": [{"q": "Number of 2-person groups from 8", "a": "28", "why": "C(8,2)=8·7/2=28."}, {"q": "Number of 3-person groups from 6", "a": "20", "why": "C(6,3)=20."}, {"q": "Are ordered 3-person lineups from 6 combinations?", "a": "no", "why": "Order matters so permutations."}]}, {"group": "Counting & Distributions", "title": "Bernoulli trials and success/failure", "source": "Oct 27 pp. 4–5", "concept": "A Bernoulli experiment has two outcomes labeled success/failure with probabilities p and q=1−p. The indicator random variable is 1 for success, 0 for failure. Independent repeated trials produce product probabilities for particular sequences.", "formulas": "P(S)=p, P(F)=q=1−p; P(specific sequence with k successes out of n)=pᵏqⁿ⁻ᵏ.", "method": "Define success → compute p and q → identify fixed order vs any arrangement → multiply appropriate factors.", "example": "Five independent trials, p=0.2: P(SSFFF).", "steps": ["This exact sequence has 2 successes and 3 failures.", "Probability 0.2²·0.8³=0.02048."], "qs": [{"q": "If success p=0.7, q?", "a": "0.3", "why": "q=1−p."}, {"q": "P(SFF) when p=0.5", "a": "0.125", "why": "(1/2)³."}, {"q": "Number of binary outcome sequences of length 5", "a": "32", "why": "2⁵=32."}]}, {"group": "Counting & Distributions", "title": "Binomial distribution formula & tables", "source": "Oct 27 p. 5; Oct 28 pp. 1–2", "concept": "X counts successes in n independent Bernoulli trials with common p. Exactly k successes can occupy C(n,k) choices; binomial probabilities sum to 1. Always identify n, p, k, and ensure independence and fixed trial count.", "formulas": "X~Bin(n,p); P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ, k=0,…,n. ΣₖP(X=k)=1.", "method": "Identify n and p → choose k positions → compute powers → multiply → sum for “at most/at least” questions.", "example": "X~Bin(4,1/3). Find P(X=2).", "steps": ["C(4,2)=6.", "P=6(1/3)²(2/3)²=6·1/9·4/9=24/81=8/27."], "qs": [{"q": "Binomial n=3,p=1/2, P(X=2)", "a": "0.375", "why": "C(3,2)(1/2)³=3/8."}, {"q": "Binomial n=4,p=1/2,P(X=0)", "a": "0.0625", "why": "(1/2)^4=1/16."}, {"q": "Binomial n=5,p=0.2,P(X=1)", "a": "0.4096", "why": "5×0.2×0.8⁴."}]}, {"group": "Counting & Distributions", "title": "Binomial tails and complements", "source": "Oct 28 pp. 1–3", "concept": "“At least” and “at most” questions require sums across outcomes. Complement methods can dramatically shorten calculations. For dice, a fixed face landing in n independent rolls corresponds to p=1/6.", "formulas": "P(X≥1)=1−(1−p)ⁿ; P(X≤k)=Σⱼ₌₀ᵏC(n,j)pʲqⁿ⁻ʲ.", "method": "Translate wording into inequalities → choose direct sum vs complement → calculate → check probability range.", "example": "Three independent fair coin flips: at least one head.", "steps": ["P(no heads)=(1/2)³=1/8.", "P(at least one)=1−1/8=7/8."], "qs": [{"q": "At least one 6 in two die throws", "a": "11/36", "why": "1−(5/6)²=11/36."}, {"q": "At least one head in 4 fair flips", "a": "15/16", "why": "1−(1/2)^4."}, {"q": "Binomial n=3,p=0.5, P(X≤1)", "a": "0.5", "why": "(1+3)/8=4/8."}]}, {"group": "Counting & Distributions", "title": "Discrete random variables & their images", "source": "Oct 28 pp. 3–5", "concept": "Random variable X is a numerical function on outcomes, X:Ω→ℝ. Distinguish the underlying outcomes from the distinct attainable values im(X); multiple outcomes may map to one number. A random variable may represent counts, minimum, sums, or payoffs.", "formulas": "im(X)={X(ω):ω∈Ω}; P(X=x)=Σ_{ω:X(ω)=x} P({ω}).", "method": "Describe outcomes → define X on each outcome → group equal numeric outputs → sum their masses.", "example": "Two dice X=minimum of faces.", "steps": ["X can be 1,2,3,4,5,6.", "P(X≥5)=P(both dice≥5)=(2/6)²=1/9.", "P(X=5)=P(X≥5)−P(X≥6)=1/9−1/36=1/12."], "qs": [{"q": "How many possible values for sum of two dice?", "a": "11", "why": "Integers 2 through 12."}, {"q": "For two dice, probability maximum is 1", "a": "1/36", "why": "Both rolls must be 1."}, {"q": "Does a random variable assign a real number to each outcome?", "a": "yes", "why": "That is its definition."}]}, {"group": "Counting & Distributions", "title": "Probability mass functions & distribution tables", "source": "Oct 28 pp. 4–5; Oct 30 p. 1", "concept": "A PMF f(x)=P(X=x) on distinct values is nonnegative and sums to one. For nonattainable values, PMF=0. Tables represent the complete distribution; compare distinguishable microstates and shared numeric values.", "formulas": "f(x)=P(X=x); f(x)≥0; Σₓf(x)=1. For two dice sum s: (1,2,3,4,5,6,5,4,3,2,1)/36 for s=2…12.", "method": "Find possible values → count or combine outcomes mapping to each → divide by total or sum masses → verify sum one.", "example": "Sum of two dice equals 3.", "steps": ["Outcomes (1,2),(2,1).", "Probability =2/36=1/18."], "qs": [{"q": "P(sum 12 on two fair dice)", "a": "1/36", "why": "Only (6,6)."}, {"q": "In Bin(2,1/2), P(X=1)", "a": "0.5", "why": "Two of four ordered coin sequences."}, {"q": "Can a PMF assign negative probability?", "a": "no", "why": "PMF entries must be nonnegative."}]}, {"group": "Counting & Distributions", "title": "Independence of random variables", "source": "Oct 28 p. 6; Oct 30 pp. 7–9", "concept": "Two discrete RVs X,Y independent iff their joint distribution factors for every pair of values. Functions U=X+Y and V=X−Y of independent X,Y need not themselves be independent. Checking E[UV]=E[U]E[V] alone is not sufficient for independence.", "formulas": "P(X=x,Y=y)=P(X=x)P(Y=y) for every x,y. Independence ⇒ E[XY]=E[X]E[Y] (converse false).", "method": "Construct joint event table → compute marginals → test factorization for all cells or find one counterexample.", "example": "Two independent fair dice X,Y, U=X+Y, V=X−Y.", "steps": ["P(U=5)>0 and P(V=0)>0.", "But U=5 implies odd sum; V=0 implies X=Y, hence even sum.", "Their intersection impossible, so U and V are dependent."], "qs": [{"q": "Does independence imply E[XY]=E[X]E[Y]?", "a": "yes", "why": "Factor joint PMF into marginal PMFs."}, {"q": "Does E[XY]=E[X]E[Y] prove independence?", "a": "no", "why": "Uncorrelated can still be dependent."}, {"q": "Are values on two independently thrown dice independent?", "a": "yes", "why": "Their joint probabilities factor."}]}, {"group": "Expected Value & Spread", "title": "Expected value (discrete) & financial games", "source": "Oct 28 p. 7; Oct 30 pp. 1–4", "concept": "Expectation is a probability-weighted average of a numerical RV. It need not be an attainable value. For repeated iid observations, the sample average tends toward E[X] under standard assumptions. Game with positive EV is favorable, zero fair, negative unfavorable, ignoring risk and utility.", "formulas": "E[X]=Σₓ x·P(X=x); E[X]=Σω X(ω)P({ω}). Game EV =Σ payoff×probability.", "method": "Create payout table → combine same outcome values → multiply each value by probability → add → interpret sign.", "example": "A game wins $50 with probability 1/4 and loses $20 otherwise.", "steps": ["E[X]=50(1/4)+(−20)(3/4)=12.5−15=−2.5.", "Negative EV: losing game for player in expectation."], "qs": [{"q": "Fair die expected face value", "a": "3.5", "why": "(1+2+3+4+5+6)/6=3.5."}, {"q": "Win $10 with p=0.2; lose $1 otherwise. EV?", "a": "1.2", "why": "10×0.2−1×0.8=1.2."}, {"q": "If EV=0, is game fair in expected-value sense?", "a": "yes", "why": "No expected gain or loss."}]}, {"group": "Expected Value & Spread", "title": "Linearity of expectation", "source": "Oct 30 pp. 3–5", "concept": "Expectation is linear for arbitrary RVs—even dependent ones. Constants can be pulled out. This enables sums of indicators or multiple dice without joint calculations.", "formulas": "E[X+Y]=E[X]+E[Y]; E[aX+bY+c]=aE[X]+bE[Y]+c.", "method": "Break a complicated expression into simpler terms → compute individual expectations → combine linearly.", "example": "Two dice X,Y: E(3X+2Y−1).", "steps": ["Each fair die has mean 3.5.", "3(3.5)+2(3.5) HTML(i,j,q){let key=`${i}:${j}`;return `<div class="question" id="box-${i}-${j}"><div class="qhead"><span>PROBLEM ${j+1} OF ${DATA[i].qs.length}</span><span id="status-${i}-${j}">${state.done[key]?'✓ MASTERED':'Not yet mastered'}</span></div><div class="qtext">${mathHTML(q.q)}</div><div class="answerrow"><input type="text" id="input-${i}-${j}" placeholder="Your answer" value="${escapeHTML(state.answers[key]||'')}" onkeydown="if(event.key==='Enter')check(${i},${j})"><button class="btn primary" onclick="check(${i},${j})">Check answer</button><button class="btn ghost" onclick="toggleSolution(${i},${j})">Show solution</button></div><div id="feedback-${i}-${j}"></div><div id="solution-${i}-${j}" class="solution ${hideSolutions?'hide':'hide'}"><strong>Answer: ${mathHTML(q.a)}</strong>\n${mathHTML(q.why)}<div style="margin-top:11px"><button class="btn" onclick="mark(${i},${j})">${state.done[key]?'✓ Already mastered':'Mark as mastered'}</button></div></div></div>`};function parseNumber(s){s=s.trim().replace(/,/g,'');let m=s.match(/^([+-]?\d+(?:\.\d+)?)\s*\/\s*([+-]?\d+(?:\.\d+)?)$/);return m?Number(m[1])/Number(m[2]):Number(s)};function normalize(s){return String(s).toLowerCase().trim().replace(/[\s()]/g,'').replace(/−/g,'-').replace(/\byes\b/g,'yes').replace(/\bno\b/g,'no')};function equivalent(guess,ans){let a=parseNumber(guess),b=parseNumber(ans);if(guess.trim()&&ans.trim()&&Number.isFinite(a)&&Number.isFinite(b))return Math.abs(a-b)<1e-5;return normalize(guess)===normalize(ans)||normalize(guess).replace(/^[a-z]+=/,'')===normalize(ans)};function check(i,j){let key=`${i}:${j}`,q=DATA[i].qs[j],input=el(`input-${i}-${j}`);let v=input.value;state.answers[key]=v;let yes=equivalent(v,q.a);if(yes)state.done[key]=true;save();el(`feedback-${i}-${j}`).innerHTML=`<div class="feedback ${yes?'good':'bad'}">${yes?'✓ Correct! Great job.':'Not quite. Check the solution, then try again.'}</div>`;if(!yes)el(`solution-${i}-${j}`).classList.remove('hide');el(`status-${i}-${j}`).textContent=state.done[key]?'✓ MASTERED':'Not yet mastered';renderSidebar()};function toggleSolution(i,j){el(`solution-${i}-${j}`).classList.toggle('hide')};function toggleAllSolutions(){hideSolutions=!hideSolutions;document.querySelectorAll('.solution').forEach(x=>x.classList.toggle('hide',hideSolutions))};function mark(i,j){state.done[`${i}:${j}`]=true;save();openTopic(i)};
let quiz=[];let qi=0;let score=0;function startQuiz(){active=-1;currentMode='quiz';quiz=DATA.flatMap((t,i)=>t.qs.map((q,j)=>({i,j,q}))).sort(()=>Math.random()-.5).slice(0,20);qi=0;score=0;renderQuiz()};function renderQuiz(){if(qi>=quiz.length){el('content').innerHTML=topNav()+`<div class="eyebrow">Mixed practice completed</div><h1 class="h1">${score} / ${quiz.length} correct</h1><p class="lead">Review anything you missed by opening its topic from the sidebar. Correct answers also count toward your mastery progress.</p><div class="actions"><button class="btn primary" onclick="startQuiz()">Try another mixed quiz</button><button class="btn" onclick="showHome()">Return to dashboard</button></div>`;renderSidebar();return}let o=quiz[qi];el('content').innerHTML=topNav()+`<div class="eyebrow">Mixed practice · Question ${qi+1}/${quiz.length}</div><h1 class="h1">Test your recall</h1><div class="progress"><div style="width:${qi/quiz.length*100}%"></div></div><div class="question"><div class="small">${escapeHTML(DATA[o.i].title)}</div><h2>${mathHTML(o.q.q)}</h2><div class="answerrow"><input id="quizInput" type="text" onkeydown="if(event.key==='Enter')gradeQuiz()" placeholder="Enter your answer"><button class="btn primary" onclick="gradeQuiz()">Submit</button></div><div id="quizResult"></div></div>`;renderSidebar();window.scrollTo(0,0);el('quizInput').focus()};function gradeQuiz(){let o=quiz[qi],v=el('quizInput').value,yes=equivalent(v,o.q.a);if(yes){score++;state.done[`${o.i}:${o.j}`]=true;save()}el('quizResult').innerHTML=`<div class="feedback ${yes?'good':'bad'}">${yes?'✓ Correct':'Incorrect'} — Answer: <strong>${mathHTML(o.q.a)}</strong><div>${mathHTML(o.q.why)}</div></div><button class="btn primary" style="margin-top:14px" onclick="qi++;renderQuiz()">Next question →</button>`;document.querySelector('.question .answerrow button').disabled=true;el('quizInput').disabled=true;renderSidebar()};function showFormulas(){active=-1;el('content').innerHTML=topNav()+`<div class="eyebrow">Quick reference</div><h1 class="h1">Complete formula sheet</h1><p class="lead">All formulas organized by the same 41 topics and linked to their full explanations. Use Ctrl/Cmd+F to find a symbol or expression.</p><div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>${headings().map(g=>`<h2 style="margin-top:34px">${escapeHTML(g)}</h2>${DATA.map((t,i)=>({t,i})).filter(o=>o.t.group===g).map(({t,i})=>`<section class="panel"><div class="top"><strong>${escapeHTML(t.title)}</strong><button class="btn ghost" onclick="openTopic(${i})">Learn topic →</button></div><div class="formula">${mathHTML(t.formulas)}</div></section>`).join('')}`).join('')}`;renderSidebar();window.scrollTo(0,0)};function showCoverage(){active=-1;el('content').innerHTML=topNav()+`<div class="eyebrow">No topic left behind</div><h1 class="h1">Lecture coverage checklist</h1><p class="lead">Every topic is mapped to the source date and pages where it appears; overlapping/repeated lecture pages are consolidated. You can study the complete archive even if your instructor later narrows the test scope.</p>${DATA.map((t,i)=>`<div class="top" style="border-bottom:1px solid var(--line);padding:13px 0;margin:0"><div><strong>${i+1}. ${escapeHTML(t.title)}</strong><div class="small">${escapeHTML(t.source)}</div></div><button class="btn ghost" onclick="openTopic(${i})">Open →</button></div>`).join('')}`;renderSidebar();window.scrollTo(0,0)};showHome();
</script></body></html>
